# /etc/nginx/sites-available/jobclick
server {
    listen 80;
    server_name jobclick.ru www.jobclick.ru;
    return 301 https://jobclick.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jobclick.ru;
    root /var/www/jobclick/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/jobclick.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobclick.ru/privkey.pem;

    client_max_body_size 20m;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 180; # генерация картинок может идти до минуты
    }

    location ~* \.(jpg|jpeg|png|webp|css|js|woff2)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }
}
