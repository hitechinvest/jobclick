; /etc/supervisor/conf.d/jobclick-worker.conf — очередь писем (драйвер database)
[program:jobclick-worker]
command=php /var/www/jobclick/artisan queue:work --tries=3 --timeout=120 --sleep=3
user=www-data
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/jobclick/storage/logs/worker.log
stopwaitsecs=130
